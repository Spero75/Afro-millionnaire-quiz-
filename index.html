<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afro Millionnaire : Le Grand Quiz</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #f59e0b;
            --accent-glow: #fbbf24;
            --danger: #ef4444;
            --success: #22c55e;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #090d16 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        /* Écrans */
        .screen {
            display: none;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* En-tête & Stats */
        .header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .lives {
            color: var(--danger);
            font-weight: bold;
        }

        .prize-money {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Accueil */
        .welcome-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
            margin-bottom: 5px;
        }

        .welcome-subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        input, select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #475569;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        /* Boutons */
        .btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #090d16;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: transform 0.2s, filter 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        /* Jokers & Indices */
        .jokers-bar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .joker-btn {
            flex: 1;
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 8px 5px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: background 0.3s;
        }

        .joker-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Question Box */
        .question-box {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .level-indicator {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .question-text {
            font-size: 1.05rem;
            line-height: 1.4;
            min-height: 60px;
        }

        /* Options de réponse */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 15px;
            color: white;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #334155;
            border-color: #64748b;
        }

        .option-btn.correct {
            background: var(--success) !important;
            border-color: #16a34a !important;
            color: #090d16;
            font-weight: bold;
        }

        .option-btn.wrong {
            background: var(--danger) !important;
            border-color: #dc2626 !important;
        }

        .option-btn.hidden-option {
            opacity: 0.2;
            pointer-events: none;
        }

        /* Indice Box */
        .hint-box {
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid var(--accent);
            padding: 10px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #fde047;
            display: none;
        }

        /* Barre Audio & Commandes */
        .audio-control {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: #94a3b8;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Barre audio discrète -->
        <div class="audio-control" onclick="toggleAudio()">
            🔊 <span id="audio-status">Musique : OFF (Activer)</span>
        </div>

        <!-- ÉCRAN 1 : ACCUEIL -->
        <div id="screen-welcome" class="screen active">
            <h1 class="welcome-title">🌍 AFRO MILLONNAIRE</h1>
            <p class="welcome-subtitle">Le Grand Quiz Culturel & Mondial</p>
            
            <div class="form-group">
                <label for="username">Votre Pseudo :</label>
                <input type="text" id="username" placeholder="Ex: Spero" value="Joueur">
            </div>

            <div class="form-group">
                <label for="country-select">Choisissez votre Pays :</label>
                <select id="country-select">
                    <option value="Bénin">🇧🇯 Bénin</option>
                    <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
                    <option value="Sénégal">🇸🇳 Sénégal</option>
                    <option value="Cameroun">🇨🇲 Cameroun</option>
                    <option value="Togo">🇹🇬 Togo</option>
                    <option value="Nigeria">🇳🇬 Nigeria</option>
                    <option value="France">🇫🇷 France / International</option>
                </select>
            </div>

            <button class="btn" onclick="startGame()">Commencer à Jouer</button>
        </div>

        <!-- ÉCRAN 2 : JEU -->
        <div id="screen-game" class="screen">
            <div class="header-stats">
                <div>❤️ Vies : <span id="lives-count" class="lives">3</span></div>
                <div>Cagnotte : <span id="money-display" class="prize-money">10 000 FCFA</span></div>
            </div>

            <!-- Jokers -->
            <div class="jokers-bar">
                <button class="joker-btn" id="joker-50" onclick="useJoker50()">
                    <span>✂️ 50/50</span>
                </button>
                <button class="joker-btn" id="joker-public" onclick="useJokerPublic()">
                    <span>📊 Public</span>
                </button>
                <button class="joker-btn" id="joker-hint" onclick="useHint()">
                    <span>💡 Indice</span>
                </button>
                <button class="joker-btn" id="joker-whatsapp" onclick="useJokerWhatsapp()">
                    <span>💬 WhatsApp</span>
                </button>
            </div>

            <div class="question-box">
                <div class="level-indicator" id="level-title">Niveau 1 : Facile</div>
                <div class="question-text" id="question-text">Chargement de la question...</div>
            </div>

            <div class="hint-box" id="hint-display">
                <strong>Indice :</strong> <span id="hint-text">...</span>
            </div>

            <div class="options-list" id="options-container">
                <!-- Généré par JS -->
            </div>
        </div>

        <!-- ÉCRAN 3 : GAME OVER / FIN -->
        <div id="screen-gameover" class="screen" style="text-align: center; padding: 20px 0;">
            <h2 id="end-title" style="color: var(--danger); font-size: 1.8rem; margin-bottom: 10px;">Partie Terminée</h2>
            <p id="end-message" style="color: #cbd5e1; margin-bottom: 20px; font-size: 1rem;">Vous avez tout perdu !</p>
            <div style="font-size: 1.3rem; color: var(--accent); margin-bottom: 25px;">Gain final : <span id="final-money">0 FCFA</span></div>
            <button class="btn" onclick="restartGame()">Rejouer une partie</button>
        </div>
    </div>

    <script>
        // --- BASE DE QUESTIONS GÉANTE ET ÉVOLUTIVE ---
        const questionsDB = [
            // FACILE / LOCAL & AFRIQUE
            {
                q: "Quel est le nom de la capitale officielle du Bénin ?",
                options: ["Cotonou", "Porto-Novo", "Parakou", "Abomey"],
                answer: 1,
                hint: "C'est une ville historique située non loin de Cotonou, mais ce n'est pas le port économique.",
                diff: "Facile"
            },
            {
                q: "Quelle est la monnaie officielle utilisée au Bénin et dans plusieurs pays de l'UEMOA ?",
                options: ["Le Naira", "Le Cedi", "Le Franc CFA", "Le Dollar"],
                answer: 2,
                hint: "Son code abréviation est XOF.",
                diff: "Facile"
            },
            {
                q: "Quel artiste béninois est l'interprète de la célèbre chanson 'Akwaba' ou de grands succès internationaux ?",
                options: ["Angélique Kidjo", "Fally Ipupa", "Davido", "Sidiki Diabaté"],
                answer: 0,
                hint: "Elle a remporté plusieurs prestigieux Grammy Awards.",
                diff: "Facile"
            },
            {
                q: "Dans quel pays d'Afrique se trouve la ville économique d'Abidjan ?",
                options: ["Sénégal", "Côte d'Ivoire", "Cameroun", "Mali"],
                answer: 1,
                hint: "C'est la patrie du Zouglou et du Coupé-Décalé.",
                diff: "Facile"
            },
            {
                q: "Quel animal est le symbole national du Bénin dans le nom de son équipe de football (les Guépards) ?",
                options: ["Le Lion", "L'Éléphant", "Le Guépard", "L'Aigle"],
                answer: 2,
                hint: "Auparavant, on les appelait les Écureuils.",
                diff: "Facile"
            },
            // MOYEN / MONDE & FOOTBALL
            {
                q: "Quel club de football européen a remporté le plus de Ligues des Champions (UEFA) de l'histoire ?",
                options: ["FC Barcelone", "Real Madrid", "AC Milan", "Bayern Munich"],
                answer: 1,
                hint: "C'est le club aux maillots blancs basé dans la capitale espagnole.",
                diff: "Moyen"
            },
            {
                q: "Quel joueur détient le record du plus grand nombre de Ballons d'Or de l'histoire ?",
                options: ["Cristiano Ronaldo", "Pelé", "Lionel Messi", "Kylian Mbappé"],
                answer: 2,
                hint: "Il est argentin et a remporté la Coupe du Monde 2022.",
                diff: "Moyen"
            },
            {
                q: "Quel est le plus grand désert chaud du monde situé en Afrique ?",
                options: ["Le désert du Kalahari", "Le désert du Namib", "Le désert du Sahara", "Le désert du Danakil"],
                answer: 2,
                hint: "Il couvre une immense partie du nord du continent africain.",
                diff: "Moyen"
            },
            {
                q: "En quelle année le Bénin (anciennement Dahomey) a-t-il obtenu son indépendance ?",
                options: ["1958", "1960", "1965", "1972"],
                answer: 1,
                hint: "C'est l'année magique des indépendances de plusieurs pays africains francophones.",
                diff: "Moyen"
            },
            {
                q: "Quel fleuve traverse l'Égypte pour se jeter dans la mer Méditerranée ?",
                options: ["Le fleuve Niger", "Le fleuve Congo", "Le Nil", "Le Zambèze"],
                answer: 2,
                hint: "C'est l'un des plus longs fleuves du monde entier.",
                diff: "Moyen"
            },
            // DIFFICILE / EXPERT
            {
                q: "Quel scientifique est mondialement connu pour avoir formulé la théorie de la relativité ?",
                options: ["Isaac Newton", "Albert Einstein", "Nikola Tesla", "Galilée"],
                answer: 1,
                hint: "Sa formule la plus célèbre est E = mc².",
                diff: "Difficile"
            },
            {
                q: "Dans la mythologie du Royaume d'Abomey, quel était le symbole du Roi Béhanzin ?",
                options: ["Le Requin", "L'Œuf", "Le Buffle", "Le Lion"],
                answer: 0,
                hint: "Il disait que 'le requin dans l'eau trouble troublera le pays'.",
                diff: "Difficile"
            },
            {
                q: "Quel pays africain n'a jamais été colonisé par une puissance européenne ?",
                options: ["Le Ghana", "L'Éthiopie", "Le Kenya", "Le Maroc"],
                answer: 1,
                hint: "Sa capitale est Addis-Abeba et il abrite le siège de l'Union Africaine.",
                diff: "Difficile"
            },
            {
                q: "Quelle est la distance approximative d'un marathon officiel en course à pied ?",
                options: ["30,5 km", "42,195 km", "50 km", "21,1 km"],
                answer: 1,
                hint: "C'est un peu plus de deux semi-marathons.",
                diff: "Difficile"
            }
        ];

        const prizeLevels = [
            "10 000 FCFA", "25 000 FCFA", "50 000 FCFA", "100 000 FCFA", 
            "250 000 FCFA", "500 000 FCFA", "1 000 000 FCFA", "2 500 000 FCFA",
            "5 000 000 FCFA", "10 000 000 FCFA", "25 000 000 FCFA", "50 000 000 FCFA",
            "100 000 000 FCFA", "500 000 000 FCFA", "1 000 000 000 FCFA"
        ];

        let currentQuestionIndex = 0;
        let lives = 3;
        let scoreIndex = 0;
        let currentQuestion = null;
        let audioCtx = null;
        let isAudioOn = false;

        // --- GESTION AUDIO (Synthétiseur Web Audio sans fichiers externes) ---
        function toggleAudio() {
            isAudioOn = !isAudioOn;
            document.getElementById('audio-status').innerText = isAudioOn ? "Musique : ON (Actif)" : "Musique : OFF (Activer)";
            if(isAudioOn && !audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, type, duration) {
            if(!isAudioOn || !audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playWinSound() {
            playTone(523.25, 'triangle', 0.15); // Do
            setTimeout(() => playTone(659.25, 'triangle', 0.15), 150); // Mi
            setTimeout(() => playTone(783.99, 'triangle', 0.3), 300); // Sol
        }

        function playWrongSound() {
            playTone(200, 'sawtooth', 0.3);
            setTimeout(() => playTone(150, 'sawtooth', 0.4), 150);
        }

        // --- NAVIGATION & JEU ---
        function startGame() {
            const username = document.getElementById('username').value || 'Joueur';
            const country = document.getElementById('country-select').value;
            
            lives = 3;
            scoreIndex = 0;
            currentQuestionIndex = 0;
            
            document.getElementById('screen-welcome').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            
            loadNextQuestion();
        }

        function loadNextQuestion() {
            // Réinitialiser les indices
            document.getElementById('hint-display').style.display = 'none';
            
            // Sélectionner une question selon l'index
            if (currentQuestionIndex >= questionsDB.length) {
                currentQuestionIndex = 0; // Boucler si besoin
            }
            currentQuestion = questionsDB[currentQuestionIndex];
            
            // Affichage UI
            document.getElementById('lives-count').innerText = lives;
            document.getElementById('money-display').innerText = prizeLevels[scoreIndex];
            document.getElementById('level-title').innerText = `Niveau ${scoreIndex + 1} : ${currentQuestion.diff}`;
            document.getElementById('question-text').innerText = currentQuestion.q;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            currentQuestion.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.onclick = () => checkAnswer(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx, btnElement) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none'); // Bloquer les clics multiples

            if (selectedIdx === currentQuestion.answer) {
                btnElement.classList.add('correct');
                playWinSound();
                
                setTimeout(() => {
                    scoreIndex++;
                    currentQuestionIndex++;
                    if (scoreIndex >= prizeLevels.length) {
                        endGame(true);
                    } else {
                        loadNextQuestion();
                    }
                }, 1200);
            } else {
                btnElement.classList.add('wrong');
                allBtns[currentQuestion.answer].classList.add('correct'); // Montrer la bonne
                playWrongSound();
                
                lives--;
                document.getElementById('lives-count').innerText = lives;

                setTimeout(() => {
                    if (lives <= 0) {
                        endGame(false);
                    } else {
                        currentQuestionIndex++;
                        loadNextQuestion();
                    }
                }, 1800);
            }
        }

        // --- JOKERS ---
        function useJoker50() {
            const allBtns = document.querySelectorAll('.option-btn');
            let hiddenCount = 0;
            allBtns.forEach((btn, idx) => {
                if (idx !== currentQuestion.answer && hiddenCount < 2) {
                    btn.classList.add('hidden-option');
                    hiddenCount++;
                }
            });
            document.getElementById('joker-50').disabled = true;
            playTone(400, 'sine', 0.2);
        }

        function useJokerPublic() {
            alert(`Sondage du Public :\n- ${String.fromCharCode(65 + currentQuestion.answer)} : 68%\n- Autres options : partagées entre 10% et 12%`);
            document.getElementById('joker-public').disabled = true;
            playTone(450, 'sine', 0.2);
        }

        function useHint() {
            document.getElementById('hint-text').innerText = currentQuestion.hint;
            document.getElementById('hint-display').style.display = 'block';
            document.getElementById('joker-hint').disabled = true;
            playTone(500, 'sine', 0.2);
        }

        function useJokerWhatsapp() {
            const text = encodeURIComponent(`Hey ! Je suis bloqué sur cette question dans Afro Millionnaire : "${currentQuestion.q}". Tu as une idée ?`);
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
            document.getElementById('joker-whatsapp').disabled = true;
        }

        function endGame(isWin) {
            document.getElementById('screen-game').classList.remove('active');
            document.getElementById('screen-gameover').classList.add('active');
            
            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-message');
            const finalMoney = document.getElementById('final-money');

            if (isWin) {
                title.style.color = 'var(--success)';
                title.innerText = "🎉 INCROYABLE !";
                msg.innerText = "Vous avez décroché le milliard et maîtrisez la culture générale haut la main !";
                finalMoney.innerText = prizeLevels[prizeLevels.length - 1];
            } else {
                title.style.color = 'var(--danger)';
                title.innerText = "Partie Terminée";
                msg.innerText = "Vous n'avez plus de vies. Retentez votre chance !";
                let securedGain = scoreIndex > 0 ? prizeLevels[scoreIndex - 1] : "0 FCFA";
                finalMoney.innerText = securedGain;
            }
        }

        function restartGame() {
            document.getElementById('screen-gameover').classList.remove('active');
            document.getElementById('screen-welcome').classList.add('active');
        }
    </script>
</body>
</html>
